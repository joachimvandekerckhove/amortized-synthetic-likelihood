[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "onnx",
    "onnxruntime",
    "onnxscript",
]

[project.optional-dependencies]
cuda = [
    # Install with: pip install -e ".[cuda,jags]" --extra-index-url https://download.pytorch.org/whl/cu126
    "torch==2.6.0",
]
jags = ["py2jags @ git+https://github.com/joachimvandekerckhove/py2jags.git", "jnnx @ git+https://github.com/joachimvandekerckhove/jnnx.git@802762d"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["asl*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
