# Smoke preset for fast local checks. Do not edit; override values in asl.toml instead.

[training]
training_epochs = 300
max_training_rows = 5000
batch_size = 512
learning_rate = 0.001
covariance_loss_weight = 1.0
mean_r2_threshold = 0.995

[cov_data]
parameter_draws = 800
trials_per_replicate = 300
replicates_per_parameter = 40
random_seed = 42

[recovery]
synthetic_subjects = 50
trials_per_subject = 500
