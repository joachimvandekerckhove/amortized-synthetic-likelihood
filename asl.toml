# User-editable ASL pipeline overrides.
#
# Defaults live in src/asl/presets/full.toml and are not meant to be edited.
# Override individual keys here. Scenario-specific overrides can be layered
# via ASL_CONFIG:
#   ASL_CONFIG=configs/recovery_highn.toml make -C scripts/ddm3 confirm-recovery

[wire]
# Optional: override auto-downloaded SDK in vendor/ (see README).
onnxruntime_dir = ""

# Optional overrides (uncomment to replace default values):
#
# [training]
# training_epochs = 10000
#
# [cov_data]
# parallel_workers = 8
#
# [recovery]
# progress_log_interval = 10
# parallel_workers = 4
